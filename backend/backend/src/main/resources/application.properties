spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/micora_db

spring.datasource.username=micora
spring.datasource.password=michelle
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.springframework.security=DEBUG
jwt.secret=${JWT_SECRET:micora-local-dev-secret-key-change-me-0123456789}
server.error.include-message=always